global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8080"]
    metrics_path: /metrics

  - job_name: worker-executor
    static_configs:
      - targets: ["worker-executor:9100"]

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: mcp-registry
    static_configs:
      - targets: ["mcp-registry:8080"]
    metrics_path: /metrics
