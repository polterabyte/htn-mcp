services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: orchestrator
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports: ["6379:6379"]

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]         
    ports: ["4222:4222", "6222:6222", "8222:8222"]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest                 
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minio minio123) do echo 'waiting for minio...' && sleep 2; done;
      mc mb -p local/artifacts || true;
      mc anonymous set download local/artifacts || true;
      echo 'minio bucket ready';
      sleep 2;
      "

  orchestrator:
    build:
      context: ./apps/orchestrator
      dockerfile: Dockerfile
    image: local/htn-orchestrator:dev
    depends_on: [postgres, redis, nats, minio]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_BUCKET: artifacts
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8080:8080"]

  worker-analyst:
    build:
      context: ./apps/workers/analyst
      dockerfile: Dockerfile
    image: local/htn-worker-analyst:dev
    environment:
      ROLE: ANALYST
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [orchestrator]

  worker-executor:
    build:
      context: ./apps/workers/executor
    image: local/htn-worker-executor:dev
    environment:
      ROLE: EXECUTOR
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [orchestrator, mcp-http]

  worker-verifier:
    build:
      context: ./apps/workers/verifier
    image: local/htn-worker-verifier:dev
    environment:
      ROLE: VERIFIER
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [orchestrator]

  worker-coordinator:
    build:
      context: ./apps/workers/coordinator
    image: local/htn-worker-coordinator:dev
    environment:
      ROLE: COORDINATOR
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on: [orchestrator]

  mcp-http:
    build:
      context: ./apps/mcp-http              
      dockerfile: Dockerfile
    image: local/mcp-http:dev
    ports: ["7000:7000"]

  otel-collector:
    image: otel/opentelemetry-collector:0.106.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports: ["4317:4317"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports: ["3000:3000"]
    depends_on: [prometheus]

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command: ["-varz", "-channelz", "-connz", "-routez", "-serverz", "-subz", "-jsz", "http://nats:8222"]
    ports: ["7777:7777"]
    depends_on: [nats]

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

volumes:
  pgdata: {}
  minio: {}
